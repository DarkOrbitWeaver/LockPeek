<g font-family="Segoe UI,Arial,sans-serif"><text x="198" y="142" fill="#fff" font-size="52" font-weight="600">LockPeek</text>
<text x="84" y="242" fill="#fff" font-size="48" font-weight="600">A file won’t delete?</text>
<text x="84" y="294" fill="#C5C5C5" font-size="24">Find the apps using it. Close them, then retry in Explorer.</text>
<g fill="#2B2B2B" stroke="#3A3A3A"><rect x="84" y="354" width="350" height="130" rx="8"/><rect x="466" y="354" width="350" height="130" rx="8"/><rect x="848" y="354" width="348" height="130" rx="8"/></g>
<g font-size="14" fill="#4CC2FF"><text x="108" y="386">01 / SELECT</text><text x="490" y="386">02 / INSPECT</text><text x="872" y="386">03 / RETRY</text></g>
<g font-size="21" font-weight="600" fill="#fff"><text x="108" y="424">Files, folders, or both</text><text x="490" y="424">See what’s using it</text><text x="872" y="424">Close, then retry</text></g>
<g font-size="16" fill="#C5C5C5"><text x="108" y="456">One selection. One window.</text><text x="490" y="456">Choose which apps to close.</text><text x="872" y="456">Then try deleting your file again.</text></g>
<text x="84" y="552" fill="#C5C5C5" font-size="17">Made for Windows 11</text><text x="1196" y="552" fill="#C5C5C5" font-size="15" text-anchor="end">DarkOrbitWeaver</text></g></svg>